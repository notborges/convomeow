openapi: 3.1.0
info:
  title: ConvoMeow native API
  version: 0.1.0
  description: >-
    The v1 API covers WhatsApp linked-device accounts, pairing, conversations,
    text and media messages, contacts, profile photos, and stored media.
security:
  - bearerToken: []
paths:
  /api/v1/events:
    get:
      parameters:
        - name: presence_account_id
          in: query
          description: Keep this account online while the stream is open. The last viewer leaving marks it unavailable.
          schema: {type: string}
      operationId: streamEvents
      summary: Subscribe to live resource changes
      description: >-
        Upgrade to WebSocket with the existing browser session or bearer token.
        The stream sends a ready frame, then resource-change and transient presence notifications.
        Refresh HTTP data after every connection; notifications are not replayed.
        See realtime.md for message types and connection lifecycle.
      responses:
        '101':
          description: WebSocket connection established.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: WebSocket origin is not allowed.
  /healthz:
    get:
      operationId: getHealth
      summary: Check process health
      security: []
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/versions:
    get:
      operationId: getAPIVersions
      summary: List supported native API versions
      security: []
      responses:
        '200':
          description: Supported versions.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: string
              example:
                versions: [v1]
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: List accounts
      responses:
        '200':
          description: Accounts in this installation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createAccount
      summary: Create a WhatsApp linked-device account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccount'
            example:
              label: sales
              provider: whatsapp
              connection_kind: linked_device
      responses:
        '201':
          description: Account created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    get:
      operationId: getAccount
      summary: Read an account
      responses:
        '200':
          description: Account and connection state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/accounts/{id}/login-attempts:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    post:
      operationId: startLoginAttempt
      summary: Start WhatsApp pairing
      responses:
        '202':
          description: Pairing started. Poll the Location URL for a QR challenge.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/accounts/{id}/uploads:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    post:
      operationId: createUpload
      summary: Store one file for a media message
      description: Unused uploads expire after 24 hours and can be sent once.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File stored.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          description: Media storage or staging space is unavailable.
        '507':
          description: Media storage quota is full.
  /api/v1/accounts/{id}/uploads/{upload_id}:
    parameters:
      - $ref: '#/components/parameters/AccountID'
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteUpload
      summary: Delete an unused upload
      responses:
        '204':
          description: Upload marked for deletion.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/accounts/{id}/login-attempts/{attempt_id}:
    parameters:
      - $ref: '#/components/parameters/AccountID'
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getLoginAttempt
      summary: Read a pairing attempt
      responses:
        '200':
          description: Current pairing state and any active QR challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/accounts/{id}/conversations:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    post:
      operationId: createConversation
      summary: Find or create a conversation for a phone number or synced contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversation'
            example:
              target:
                type: phone_number
                value: '+15551234567'
      responses:
        '200':
          description: Existing conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '201':
          description: Conversation created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/accounts/{id}/contacts:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    get:
      operationId: listContacts
      summary: List synced contacts
      description: Includes contacts with no conversation. Results use contact name order.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          description: Match a name, phone number, or provider ID.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Contacts from the linked account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/accounts/{id}/contacts/{provider_id}:
    parameters:
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/ProviderContactID'
    get:
      operationId: getContact
      summary: Read a synced contact
      responses:
        '200':
          description: Saved name and available phone number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/accounts/{id}/avatar:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    get:
      operationId: getAccountAvatar
      summary: Read the account's own profile photo
      description: Returns a saved preview while the account is disconnected. A missing photo requires a connected account to fetch it.
      responses:
        '200':
          description: Profile photo preview.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: Profile photo could not be fetched from the provider.
        '503':
          description: Saved media is unavailable or staging is busy.
        '507':
          description: Media storage limit reached.
  /api/v1/accounts/{id}/contacts/{provider_id}/avatar:
    parameters:
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/ProviderContactID'
    get:
      operationId: getContactAvatar
      summary: Read a contact's profile photo
      description: Returns a saved preview while the account is disconnected. A missing photo requires a connected account to fetch it.
      responses:
        '200':
          description: Profile photo preview.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: Profile photo could not be fetched from the provider.
        '503':
          description: Saved media is unavailable or staging is busy.
        '507':
          description: Media storage limit reached.
  /api/v1/conversations:
    get:
      operationId: listConversations
      summary: List conversations
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
          description: Limit the list to one account.
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Newest conversations first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    get:
      operationId: getConversation
      summary: Read a conversation
      responses:
        '200':
          description: Conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/conversations/{id}/avatar:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    get:
      operationId: getConversationAvatar
      summary: Read a conversation's profile photo
      description: Returns a saved contact or group preview while the account is disconnected.
      responses:
        '200':
          description: Contact or group photo preview.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: Profile photo could not be fetched from the provider.
        '503':
          description: Saved media is unavailable or staging is busy.
        '507':
          description: Media storage limit reached.
  /api/v1/conversations/{id}/history-requests:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: requestConversationHistory
      summary: Request earlier messages from the provider
      description: Requests up to 50 messages before a saved, confirmed message. Provider responses merge into the conversation asynchronously. Acceptance does not guarantee delivery or complete history; the primary device may need to be online.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before_message_id]
              properties:
                before_message_id:
                  type: string
                count:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 50
      responses:
        '202':
          description: History request sent to the provider.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, status]
                properties:
                  request_id:
                    type: string
                  status:
                    type: string
                    enum: [requested]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: History request failed.

  /api/v1/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    get:
      operationId: listConversationMessages
      summary: List messages in a conversation
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: around_message_id
          in: query
          description: Return a bounded window containing this saved message. Mutually exclusive with cursor and after_cursor.
          schema:
            type: string
        - name: after_cursor
          in: query
          description: Load messages newer than this cursor, still returned newest first. Mutually exclusive with cursor and around_message_id.
          schema:
            type: string
      responses:
        '200':
          description: Newest provider message timestamps first. History may arrive after newer messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: sendMessage
      summary: Send text or stored media
      description: >-
        ConvoMeow stores a send record before calling the provider. A provider error
        can leave the record in outcome_unknown; inspect the message before retrying.
        Reuse the same Idempotency-Key to retrieve the same send record.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: '^[!-~]{8,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SendText'
                - $ref: '#/components/schemas/SendMedia'
            example:
              kind: text
              content:
                text: Hello
      responses:
        '201':
          description: Text send record created or returned for a repeated key.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '202':
          description: Media send queued or returned for a repeated key. Poll Location for its state.
          headers:
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
              description: Suggested poll interval in seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/messages:
    get:
      operationId: listAccountMessages
      summary: List messages for one account
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Newest provider message timestamps first. History may arrive after newer messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/conversations/{id}/presence:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: sendChatPresence
      summary: Send typing, recording, or paused activity
      description: >-
        Sends transient activity to the provider without saving a message.
        Throttle repeated activity updates and send paused on inactivity or leaving the chat.
        Active client leases expire after ten seconds; one client pausing does not cancel another.
        The server limits unchanged activity refreshes to once per three seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity, client_id]
              properties:
                client_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Unique identifier for this composer instance; reuse it for refresh and paused commands.
                activity:
                  type: string
                  enum: [typing, recording, paused]
      responses:
        '204':
          description: Activity sent to the provider.
        '400':
          description: Invalid activity or unsupported provider capability.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Account is not connected.
  /api/v1/conversations/{id}/read-receipts:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: sendReadReceipts
      summary: Send read receipts for selected incoming messages
      description: >-
        Explicit provider command. Reading messages through GET routes does not send
        read receipts. Validates the whole batch before sending, then batches by sender.
        Provider privacy settings still apply. Repeating successfully recorded IDs is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_ids]
              properties:
                message_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: {type: string}
      responses:
        '200':
          description: Per-batch results, including partial failures. Inspect failed even on HTTP 200.
          content:
            application/json:
              schema:
                type: object
                required: [read_message_ids, failed]
                properties:
                  read_message_ids:
                    type: array
                    items: {type: string}
                  failed:
                    type: array
                    items:
                      type: object
                      required: [message_ids, code]
                      properties:
                        message_ids:
                          type: array
                          items: {type: string}
                        code:
                          type: string
                          enum: [receipt_send_failed, receipt_record_failed]
                          description: Recording can fail after the provider accepted a receipt.
        '400':
          description: Invalid batch or unsupported provider capability.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Account is not connected.
  /api/v1/messages/{id}/reaction:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    put:
      operationId: setMessageReaction
      summary: Set or replace the connected account reaction
      description: >-
        Uses a confirmed saved message in a direct or group conversation.
        This changes the real provider account. Commands set the desired state;
        they do not toggle it. There is no automatic retry or persistent command queue.
        A reaction_unconfirmed error may mean the provider accepted the change;
        refresh the message before explicitly retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [emoji]
              properties:
                emoji:
                  type: string
                  description: One supported Unicode emoji, including skin tones and joined sequences. Maximum 128 UTF-8 bytes. Use DELETE to remove.
                  example: "👍"
      responses:
        '200':
          description: Updated message after provider acknowledgment, or unchanged message when the requested emoji is already saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: Reaction outcome could not be confirmed. Code reaction_unconfirmed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/TooLarge'
    delete:
      operationId: removeMessageReaction
      summary: Remove the connected account reaction
      description: >-
        Uses a confirmed saved message in a direct or group conversation.
        This changes the real provider account. Commands set the desired state;
        they do not toggle it. There is no automatic retry or persistent command queue.
        A reaction_unconfirmed error may mean the provider accepted the change;
        refresh the message before explicitly retrying.
      responses:
        '200':
          description: Updated message after provider acknowledgment, or unchanged message when the requested emoji is already saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: Reaction outcome could not be confirmed. Code reaction_unconfirmed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/messages/{id}/reactions:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listMessageReactions
      summary: List current reaction participants
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Current participants ordered by opaque participant ID. Removed reactions are omitted.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageReaction'
                  next_cursor: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/messages/{id}/receipts:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listMessageReceipts
      summary: List observed recipient receipts for an outgoing message
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Participants ordered by ID. An absent receipt does not prove a message is unread.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageReceipt'
                  next_cursor: {type: string}
        '400':
          description: Invalid query or incoming message.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMessage
      summary: Read a message
      responses:
        '200':
          description: Message and current send state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: editMessage
      summary: Edit a sent message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: {type: string, minLength: 1, description: Up to 4096 UTF-8 bytes.}
      responses:
        '200':
          description: Updated message after provider acknowledgment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '400': {description: Invalid request.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Message is ineligible or account is disconnected.}
        '422': {description: Connection does not support editing.}
        '502': {description: Change outcome is unconfirmed. Refresh before retrying.}
  /api/v1/messages/{id}/revoke:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: revokeMessage
      summary: Request deletion for everyone
      description: ConvoMeow retains saved content and marks the message as deleted.
      responses:
        '200':
          description: Message with deletion marker after provider acknowledgment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Message is ineligible or account is disconnected.}
        '422': {description: Connection does not support revocation.}
        '502': {description: Change outcome is unconfirmed. Refresh before retrying.}
  /api/v1/messages/{id}/revisions:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: listMessageRevisions
      summary: Read saved message history
      description: First saved text and received changes, newest first. Unreceived versions are unavailable.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: Saved revisions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/MessageRevision'}
                  next_cursor: {type: string}
        '400': {description: Invalid pagination.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/AttachmentID'
    get:
      operationId: getAttachment
      summary: Read attachment metadata
      responses:
        '200':
          description: Current attachment metadata and availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/attachments/{id}/content:
    parameters:
      - $ref: '#/components/parameters/AttachmentID'
    get:
      operationId: getAttachmentContent
      summary: Download an attachment
      description: A remote file starts a background download. Poll this route after a 202 response. Stored files use private browser caching for one day, vary by authentication, and support ETag revalidation.
      parameters:
        - name: Range
          in: header
          schema:
            type: string
          description: One byte range, such as bytes=0-1023.
        - name: If-None-Match
          in: header
          schema:
            type: string
          description: ETag from a previously downloaded file.
        - name: If-Range
          in: header
          schema:
            type: string
          description: Apply the range only if this ETag still matches; otherwise return the full file.
      responses:
        '304':
          description: The cached file is unchanged.
        '200':
          description: Full file from the configured storage profile.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Requested byte range.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '202':
          description: Download pending. Retry-After gives a poll interval in seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: Attachment content is unavailable.
        '413':
          description: Media exceeds the configured file limit.
        '416':
          description: Invalid or unsatisfiable byte range.
        '503':
          description: Storage is unavailable or the download queue is full.
        '507':
          description: Configured media storage limit reached.
    head:
      operationId: headAttachmentContent
      summary: Check a stored attachment
      description: Returns the same status and content headers as GET without starting a download or sending a body.
      responses:
        '200':
          description: Stored file is ready.
        '304':
          description: The cached file is unchanged.
        '206':
          description: Stored byte range is ready.
        '202':
          description: File is remote; no download was started.
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: >-
        The current control token grants access to every account. Keep this API
        on loopback until user sessions and scoped API keys are implemented.
  parameters:
    AccountID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProviderContactID:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
      description: Provider ID from a contact response. URL-encode it in this path.
    ConversationID:
      name: id
      in: path
      required: true
      schema:
        type: string
    AttachmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Use next_cursor from the previous page.
  responses:
    BadRequest:
      description: Invalid JSON, field, or query value.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Bearer token missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicting state or idempotency key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooLarge:
      description: Request exceeds its size limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Request body has an unsupported media type.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, code, request_id]
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string
    CreateAccount:
      type: object
      additionalProperties: false
      required: [label, provider, connection_kind]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        provider:
          type: string
          const: whatsapp
        connection_kind:
          type: string
          const: linked_device
    Account:
      type: object
      required: [id, provider, connection_kind, label, state, capabilities, created_at, updated_at]
      properties:
        id:
          type: string
        provider:
          type: string
        connection_kind:
          type: string
        label:
          type: string
        avatar_url:
          type: string
          description: URL for the account's profile photo; requires a paired account.
        provider_identity:
          type: string
        state:
          type: string
        last_error:
          type: string
        capabilities:
          description: Implemented connection features. Missing capabilities are unsupported; message actions apply additional eligibility rules.
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccountPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    LoginAttempt:
      type: object
      required: [id, state]
      properties:
        id:
          type: string
        state:
          type: string
        challenge:
          type: object
          required: [type, value, expires_at]
          properties:
            type:
              type: string
            value:
              type: string
            expires_at:
              type: string
              format: date-time
        error:
          type: string
    CreateConversation:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              type: string
              enum: [phone_number, contact]
            value:
              type: string
              description: Phone number or provider_id from a synced contact.
    Contact:
      type: object
      required: [provider_id, name, avatar_url]
      properties:
        provider_id:
          type: string
        name:
          type: string
          description: Saved name, business name, push name, or number when no name is available.
        phone:
          type: string
          description: Present when WhatsApp exposes the full phone number.
        masked_phone:
          type: string
          description: Redacted number supplied for some group members.
        avatar_url:
          type: string
          description: Authenticated API path. Returns 404 if the photo is missing or hidden.
    ContactPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        next_cursor:
          type: string
    Conversation:
      type: object
      required: [id, account_id, provider_chat_id, kind, display_name, avatar_url, created_at, updated_at]
      properties:
        id:
          type: string
        account_id:
          type: string
        provider_chat_id:
          type: string
          description: Provider identifier for display or interoperability. Use id in URL paths.
        kind:
          type: string
          enum: [direct, group]
        display_name:
          type: string
        description:
          type: string
          description: Group description when available.
        avatar_url:
          type: string
          description: Authenticated API path. Returns 404 if the photo is missing or hidden.
        contact:
          $ref: '#/components/schemas/Contact'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Most recent saved message timestamp, or the provider's conversation timestamp if no supported message was imported.
        last_message:
          $ref: '#/components/schemas/Message'
    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        next_cursor:
          type: string
    SendText:
      type: object
      additionalProperties: false
      required: [kind, content]
      properties:
        reply_to_message_id:
          type: string
          description: A confirmed saved message in this conversation to reply to. Included in idempotency checks.
        kind:
          type: string
          const: text
        content:
          type: object
          additionalProperties: false
          required: [text]
          properties:
            text:
              type: string
              minLength: 1
              description: 1-4096 UTF-8 bytes after trimming surrounding whitespace.
    SendMedia:
      type: object
      additionalProperties: false
      required: [kind, content]
      description: Images accept JPEG, PNG, or WebP; videos accept MP4 or 3GPP; audio accepts MP3, MP4, Ogg, AAC, or AMR. Documents accept any valid MIME type. Stickers require static WebP.
      properties:
        reply_to_message_id:
          type: string
          description: A confirmed saved message in this conversation to reply to. Included in idempotency checks.
        kind:
          type: string
          enum: [image, video, audio, document, sticker]
        content:
          type: object
          additionalProperties: false
          required: [upload_id]
          properties:
            upload_id:
              type: string
              description: ID of a ready upload owned by the conversation's account.
            caption:
              type: string
              description: Up to 1024 UTF-8 bytes. Accepted for images, videos, and documents only.
    Upload:
      type: object
      required: [id, account_id, mime_type, file_name, size, expires_at]
      properties:
        id:
          type: string
        account_id:
          type: string
        mime_type:
          type: string
        file_name:
          type: string
        size:
          type: integer
          format: int64
          minimum: 1
        expires_at:
          type: string
          format: date-time
    Reply:
      type: object
      required: [kind]
      properties:
        deleted: {type: boolean, description: The quoted message was deleted by the provider; saved quote text is retained.}
        message_id:
          type: string
          description: Saved original message ID, omitted when the original is not available locally.
        sender_id:
          type: string
        kind:
          type: string
          description: Quoted message type, or unknown for unsupported content.
        text:
          type: string
          maxLength: 512
          description: Quoted text or caption preview.
    MessageReceipt:
      type: object
      required: [participant_id]
      properties:
        participant_id: {type: string}
        display_name: {type: string}
        delivered_at: {type: string, format: date-time}
        read_at: {type: string, format: date-time}
    DeliverySummary:
      type: object
      required: [state, delivered_count, read_count, group]
      description: >-
        Observed recipient activity, independent of send-job state. Reads count as
        delivered without inventing a delivery timestamp. Groups expose observed counts;
        the full recipient set is unknown, so group states remain partial.
      properties:
        state:
          type: string
          enum: [unknown, delivered, read, partial_delivered, partial_read]
        delivered_count: {type: integer, minimum: 0}
        read_count: {type: integer, minimum: 0}
        group: {type: boolean}
    ReactionSummary:
      type: object
      required: [emoji, count, own]
      properties:
        emoji: {type: string}
        count: {type: integer, minimum: 1}
        own:
          type: boolean
          description: The connected account currently uses this emoji.
    MessageReaction:
      type: object
      required: [participant_id, is_own, emoji, at]
      properties:
        participant_id:
          type: string
          description: Opaque participant identity. The connected account uses the stable value self across linked devices.
        display_name: {type: string}
        avatar_url:
          type: string
          description: Authenticated avatar URL, omitted when the provider does not support avatars.
        is_own: {type: boolean}
        emoji: {type: string}
        at: {type: string, format: date-time}
    MessageRevision:
      type: object
      required: [id, kind, at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [original, edit, revoke]}
        text: {type: string}
        at: {type: string, format: date-time}
    MessageActions:
      type: object
      required: [reply, react, edit, revoke, receipts]
      properties:
        reply: {type: boolean}
        react: {type: boolean}
        edit: {type: boolean}
        revoke: {type: boolean}
        receipts: {type: boolean}
        edit_until: {type: string, format: date-time}
        revoke_until: {type: string, format: date-time}
    Message:
      type: object
      required: [id, account_id, conversation_id, direction, state, kind, content, occurred_at, ingested_at]
      properties:
        actions: {$ref: '#/components/schemas/MessageActions'}
        edited_at: {type: string, format: date-time}
        deleted_at:
          type: string
          format: date-time
          description: Provider deletion time. Saved content and attachments remain available.
        reactions:
          type: array
          description: Current observed reaction counts. Omitted when empty. History coverage depends on provider data.
          items:
            $ref: '#/components/schemas/ReactionSummary'
        delivery:
          $ref: '#/components/schemas/DeliverySummary'
        read_at:
          type: string
          format: date-time
          description: Time the explicit read command succeeded for this incoming message. Does not track reads on other devices.
        reply:
          $ref: '#/components/schemas/Reply'
        id:
          type: string
        account_id:
          type: string
        conversation_id:
          type: string
        provider_message_id:
          type: string
        direction:
          type: string
        state:
          type: string
          description: >-
            Inbound messages are received. Outbound messages may be queued,
            sent, failed, or outcome_unknown.
        sender_id:
          type: string
        kind:
          type: string
        content:
          type: object
          properties:
            text:
              type: string
            caption:
              type: string
        attachments:
          type: array
          description: Attachment metadata. Fetch content through the attachment content route.
          items:
            $ref: '#/components/schemas/Attachment'
        occurred_at:
          type: string
          format: date-time
          description: Timestamp supplied by the provider. Message pages use this timestamp, provider ordering when available, and a saved local sequence for ordering.
        ingested_at:
          type: string
          format: date-time
          description: Time ConvoMeow stored the message.
    Attachment:
      type: object
      required: [id, kind, availability]
      properties:
        duration_seconds:
          type: integer
          minimum: 1
          description: Audio or video duration in seconds, when known.
        width:
          type: integer
          minimum: 1
          description: Media width in pixels, when known.
        height:
          type: integer
          minimum: 1
          description: Media height in pixels, when known.
        attempt_count:
          type: integer
          minimum: 0
          description: Failed download attempts. Available when reading attachment metadata. A remote file with failed attempts may be waiting for a retry.
        id:
          type: string
        kind:
          type: string
          enum: [image, video, audio, document, sticker]
        mime_type:
          type: string
        file_name:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        availability:
          type: string
          enum: [remote, ready, unavailable]
          description: Remote media can be requested; ready media is stored; unavailable media cannot be recovered.
    MessagePage:
      type: object
      required: [items]
      properties:
        previous_cursor:
          type: string
          description: Cursor for newer messages from a window or after_cursor request. Pass it as after_cursor.
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_cursor:
          type: string
